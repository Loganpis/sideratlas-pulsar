[simulation]
  name    = "sideratlas-pic-smoke-3d"
  engine  = "srpic"
  runtime = 8.0

[grid]
  resolution = [16, 16, 16]
  extent     = [[-4.0, 4.0], [-4.0, 4.0], [-4.0, 4.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"], ["PERIODIC"], ["PERIODIC"]]
    particles = [["PERIODIC"], ["PERIODIC"], ["PERIODIC"]]

[scales]
  larmor0    = 1.0
  skindepth0 = 1.0

[algorithms]
  current_filters = 4

  [algorithms.timestep]
    CFL = 0.5

[particles]
  ppc0 = 4.0

  [[particles.species]]
    label    = "e-_p"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 1e5

  [[particles.species]]
    label    = "e+_p"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 1e5

  [[particles.species]]
    label    = "e-_b"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 1e5

  [[particles.species]]
    label    = "e+_b"
    mass     = 1.0
    charge   = 1.0
    maxnpart = 1e5

[setup]
  Bmag = 0.0
  Btheta = 0.0
  Bphi = 0.0
  # Drift 4-velocities for each species in all 3 directions
  #   @type: array of floats (length = nspec)
  #   @default: [ 0.0, ... ]
  drifts_in_x  = [0.0, 0.0, 0.0, 0.0]
  drifts_in_y  = [0.0, 0.0, 0.0, 0.0]
  drifts_in_z  = [0.3, 0.3, -0.3, -0.3]
  # Pair-wise species densities in units of n0
  #   @type: array of floats (length = nspec/2)
  #   @default: [ 2 / nspec, ... ]
  densities    = [0.5, 0.5]
  # Species temperatures in units of m0 (c^2)
  #   @type: array of floats (length = nspec)
  #   @default: [ 0.0, ... ]
  temperatures = [1e-4, 1e-4, 1e-4, 1e-4]

[output]
  interval_time = 0.25

  [output.fields]
    quantities = [
      "N_1_2",
      "N_3_4",
      "E",
      "B",
      "T0i_1",
      "T0i_2",
      "T0i_3",
      "T0i_4",
    ]

  [output.particles]
    enable = false

  [output.spectra]
    enable = false

[diagnostics]
  interval = 1
  colored_stdout = false
  log_level = "VERBOSE"

[checkpoint]
  keep = 0
