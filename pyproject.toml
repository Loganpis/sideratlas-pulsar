[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sideratlas-pulsar"
version = "1.1.0"
description = "Calculated gamma-ray photon visualization from a recorded force-free pulsar model"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.13", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7.4", "h5py>=3.10"]
physics = ["astropy>=6", "h5py>=3.10", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "physics/tests"]
